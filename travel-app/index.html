<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅迹 · 历史原型已停用</title>
<style>
  :root{--paper:#F5F2EA;--ink:#16211D;--muted:#717A73;--jade:#1B6653;--line:#DED8C8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font-family:"Noto Serif SC","Songti SC",serif;padding:24px}
  .card{width:min(560px,100%);background:#FBFAF6;border:1px solid var(--line);border-radius:24px;padding:34px 30px;
    box-shadow:0 24px 60px -40px rgba(22,33,29,.45)}
  .mark{width:44px;height:44px;border-radius:14px;background:var(--jade);color:#F7F2E4;display:grid;place-items:center;
    font-size:20px;margin-bottom:20px}
  .k{font:10px/1.4 ui-monospace,monospace;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  h1{font-size:30px;line-height:1.3;margin:8px 0 12px;font-weight:600}
  p{font:14px/1.8 -apple-system,"Segoe UI",sans-serif;color:#3D4842;margin:0 0 10px}
  .note{border-left:3px solid #D8B96F;padding:10px 14px;background:#F7F2E4;border-radius:0 10px 10px 0;
    font:12px/1.7 -apple-system,"Segoe UI",sans-serif;color:#5C5A4A;margin:18px 0 22px}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;
    text-decoration:none;font:13px/1 -apple-system,"Segoe UI",sans-serif}
  .primary{background:var(--jade);color:#F7F2E4}
  .ghost{border:1px solid var(--line);color:var(--muted)}
  .foot{margin-top:22px;font:11px/1.7 -apple-system,"Segoe UI",sans-serif;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="mark">旅</div>
  <div class="k">TRAVELOG · LEGACY PROTOTYPE</div>
  <h1>这个静态原型已停用</h1>
  <p>它包含早期用于演示的预置用户、回忆、发布和好友数据，已不符合当前的“新账号默认空数据”规则。</p>
  <p>请使用 React 版客户端。新注册账号的城市、回忆盒、发布、消息、同城大厅和队伍都会从 0 开始。</p>
  <div class="note">React 版启动后默认地址为 <b>http://127.0.0.1:5173/</b>。本页不再加载任何演示数据。</div>
  <div class="actions">
    <a class="primary" href="http://127.0.0.1:5173/" target="_blank" rel="noreferrer">打开 React 版</a>
    <a class="ghost" href="../travelog-app/README.md">查看客户端说明</a>
  </div>
  <div class="foot">历史文件保留在 <code>index.legacy.html</code>，仅供设计对照，不参与验收。</div>
</main>
</body>
</html>
