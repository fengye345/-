server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: travelog-server
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

travelog:
  jwt:
    secret: "travelog-demo-secret-change-me-in-production-2026"
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 2592000
  share:
    ttl-hours: 24
  ai:
    daily-quota: 10

logging:
  level:
    root: INFO
    cn.travelog: INFO
